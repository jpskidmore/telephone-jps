name: Isolated macOS validation

on:
  push:
    branches:
      - fix/audio-start-recovery
      - main

permissions:
  contents: read

concurrency:
  group: isolated-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Public repository + standard label only: no paid larger runner.
    if: ${{ github.repository == 'jpskidmore/telephone-jps' && !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Run isolated harnesses and unsigned build
        shell: bash
        run: ./Scripts/run-isolated-audio-validation.sh
      # Deliberately no secrets, signing, deployment, app launch, hosted XCTest,
      # cache, artifact upload or paid service. Evidence stays in ordinary logs.
